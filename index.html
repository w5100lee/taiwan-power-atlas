:"白日尖峰救星，但夜間仍需其他電力接手。"},geo:{key:"geo",label:"地熱",en:"GEO",color:"#f87171",co2PerKwh:.015,blurb:"台灣位於火環帶，地熱是尚未完全甦醒的基載綠能。"}},Si=[{id:"nuclear-1",name:"第一核能發電廠（金山）",short:"核一廠",type:"nuclear",status:"已除役",city:"新北市・金山",lon:121.66,lat:25.3,capacityMw:1272,units:"沸水式 BWR × 2（各 636 MW）",operator:"台灣電力公司",commissioned:"1978 / 1979 商轉，2019 屆齡除役",description:"台灣第一座核電廠，兩部奇異沸水式機組。一號機因燃料池滿載自 2014 年起停機，兩部機組運轉執照雙雙屆滿後正式進入除役程序。",insight:"除役一座核電廠預計需 25 年：乾式貯存、反應爐除污拆解、廠址復原——核廢料最終處置場址至今仍是未解的政策難題。"},{id:"nuclear-2",name:"第二核能發電廠（國聖）",short:"核二廠",type:"nuclear",status:"已除役",city:"新北市・萬里",lon:121.7,lat:25.21,capacityMw:1970,units:"沸水式 BWR-6 × 2（各 985 MW）",operator:"台灣電力公司",commissioned:"1981 / 1983 商轉，2023 屆齡除役",description:"曾是北台灣最大的單一電源之一。一號機 2021 年因用過燃料池容量受限提前停機，二號機 2023 年 3 月運轉執照屆滿停止運轉。",insight:"「燃料池滿了就只能停機」——核二的命運揭示了電廠工程與核廢料治理如何緊密耦合，是能源政策課的經典案例。"},{id:"nuclear-3",name:"第三核能發電廠（馬鞍山）",short:"核三廠",type:"nuclear",status:"除役中",city:"屏東縣・恆春",lon:120.75,lat:21.96,capacityMw:1902,units:"壓水式 PWR × 2（各 951 MW）",operator:"台灣電力公司",commissioned:"1984 / 1985 商轉，2025.05 全面停機",description:"台灣最後運轉的核電廠，西屋三迴路壓水式機組。一號機於 2024 年 7 月屆齡停機，二號機 2025 年 5 月停止運轉，台灣正式進入「非核家園」時代。",insight:"核三歲末占全國發電量約 5%。它的退場考驗電網韌性：備轉容量、燃氣接收站擴建與綠能佈局必須無縫接手。"},{id:"taichung",name:"台中發電廠",short:"台中電廠",type:"coal",status:"運轉中",city:"台中市・龍井",lon:120.48,lat:24.21,capacityMw:5824,units:"燃煤 × 10（各 550 MW）＋氣渦輪 × 4",operator:"台灣電力公司",commissioned:"1989–1997 陸續商轉",description:"全球規模數一數二的燃煤電廠，總裝置容量近 5.8 GW，尖峰時期供應全台近兩成電力。廠區正加建燃氣複循環機組，規劃逐步退場部分燃煤機組。",insight:"中部空污治理的核心熱區：府會「生煤管制自治條例」與中央供電安全的拉鋸，是環境政策與能源經濟交鋒的教科書現場。"},{id:"hsinta",name:"興達發電廠",short:"興達電廠",type:"coal",status:"運轉中",city:"高雄市・永安／茄萣",lon:120.2,lat:22.86,capacityMw:4326,units:"燃煤 × 4・燃氣複循環 × 5",operator:"台灣電力公司",commissioned:"1982 起商轉",description:"南台灣供電樞紐，燃煤與燃氣機組並存。正執行「興達燃氣機組更新改建計畫」，新機組上線後燃煤機組將轉為備用、逐步退休。",insight:"一部電廠讀懂台灣能源轉型：同一個廠址上，燃煤基載 → 燃氣接替 → 預留氫能混燒空間，是「無縫接軌」策略的縮影。"},{id:"linkou",name:"林口發電廠",short:"林口電廠",type:"coal",status:"運轉中",city:"新北市・林口",lon:121.29,lat:25.12,capacityMw:2400,units:"超超臨界燃煤 × 3（各 800 MW）",operator:"台灣電力公司",commissioned:"2016–2019 新機商轉",description:"全台發電效率最高的燃煤電廠之一，超超臨界（USC）鍋爐效率逾 44%。機組緊鄰大台北負載中心，直接支援北台灣用電。",insight:"同樣是煤，效率從 38% 提到 44%，一年可少燒數十萬噸煤——「煤電的終結」與「煤電的升級」在能源轉型期同時進行。"},{id:"mailiao",name:"麥寮發電廠",short:"麥寮電廠",type:"coal",status:"運轉中",city:"雲林縣・麥寮",lon:120.11,lat:23.79,capacityMw:1800,units:"燃煤 × 3（各 600 MW）",operator:"麥寮汽電（台塑集團）",commissioned:"1999–2000 商轉",description:"台灣最早的民營燃煤電廠之一（IPP），位於六輕工業區填海造陸新生地，售電併入台電電網，契約容量曾是民營電廠標竿。",insight:"IPP（獨立發電業者）制度示範點：政府保證收購費率如何換取民間資本快速蓋電廠？台灣 1990 年代電力自由化的起點。"},{id:"heping",name:"和平發電廠",short:"和平電廠",type:"coal",status:"運轉中",city:"花蓮縣・秀林",lon:121.76,lat:24.3,capacityMw:1320,units:"燃煤 × 2（各 660 MW）",operator:"和平電力（台泥集團）",commissioned:"2002 商轉",description:"東部唯一的燃煤電廠，電力經 345kV 超高壓線直送北部使用。與和平水泥廠、和平工業港構成「電廠—水泥—港口」循環園區。",insight:"「東電北送」代表什麼？電網拓撲與區域公平議題：發電在花蓮、用電在台北，誰承擔污染、誰享受電力？"},{id:"dalin",name:"大林發電廠",short:"大林電廠",type:"coal",status:"運轉中",city:"高雄市・小港",lon:120.42,lat:22.5,capacityMw:2400,units:"超超臨界燃煤 × 2（各 800 MW）＋氣渦輪",operator:"台灣電力公司",commissioned:"2018 / 2019 新機商轉",description:"高雄小港的老電廠退場重生，新機採超超臨界技術並強化除污設備。廠區同步布局燃氣機組，承接南台灣工業用電需求。",insight:"重工業城市 × 電廠 × 空污：大林與小港臨海工業區是研究「環境正義」與「能源轉型空間政治」的理想田野。"},{id:"tatan",name:"大潭發電廠",short:"大潭電廠",type:"gas",status:"擴建中",city:"桃園市・觀音",lon:121.05,lat:25.02,capacityMw:4400,units:"燃氣複循環 × 6（7–9 號機擴建中）",operator:"台灣電力公司",commissioned:"2006 起商轉",description:"北部最大燃氣基地，現有約 4.4 GW；7–9 號機陸續併網後將成為全台最大的天然氣電源。毗鄰的第三天然氣接收站（觀塘）牽動藻礁保育爭議。",insight:"「三接 vs 藻礁」公投（2021）是能源基礎建設與生態保育正面對撞的指標事件——同學可思辨：基礎建設選址程序該如何設計？"},{id:"tungshiao",name:"通霄發電廠",short:"通霄電廠",type:"gas",status:"擴建中",city:"苗栗縣・通霄",lon:120.72,lat:24.48,capacityMw:3600,units:"燃氣複循環機組群（更新擴建中）",operator:"台灣電力公司",commissioned:"1983 起商轉／新機 2017 起",description:"中台灣的燃氣主力。既有複循環約 3.6 GW，「更新擴建計畫」新增高效率機組後總容量將突破 6 GW，是承接核電退場的關鍵拼圖。",insight:"燃氣機組從點火到滿載只需約 30–60 分鐘，升降載速度遠優於燃煤與核能，因此成為太陽能下山後的「接力棒」。"},{id:"nanpu",name:"南部發電廠",short:"南部電廠",type:"gas",status:"運轉中",city:"高雄市・前鎮",lon:120.32,lat:22.58,capacityMw:1117,units:"燃氣複循環 × 3",operator:"台灣電力公司",commissioned:"1955 建廠／2003 燃氣複循環商轉",description:"高雄市區的老電廠，從燃油、燃煤一路轉型為燃氣複循環。位於人口稠密的市區邊緣，是都市電廠轉型的示範案例。",insight:"電廠就在你家隔壁：都市型電廠承擔南部尖峰，其噪音、熱排放與景觀爭議是「鄰避設施」研究的經典場域。"},{id:"hsiehho",name:"協和發電廠",short:"協和電廠",type:"oil",status:"運轉中",city:"基隆市・中山",lon:121.8,lat:25.13,capacityMw:2e3,units:"燃油汽力 × 4（各 500 MW）",operator:"台灣電力公司",commissioned:"1977–1985 商轉",description:"北台灣僅存的大型燃油電廠，重油機組成本與碳排雙高。「第四天然氣接收站」計畫擬於協和廠區改建燃氣機組，但港址與生態議題爭議不斷。",insight:"燃油機組是電價的「邊際定價者」：夏季尖峰只要它一上場，系統邊際成本立刻飆高——用來理解電力市場定價再好不過。"},{id:"chienshan",name:"尖山發電廠",short:"尖山電廠",type:"oil",status:"運轉中",city:"澎湖縣・湖西",lon:119.62,lat:23.56,capacityMw:52,units:"柴油機組 × 7（＋風機並聯）",operator:"台灣電力公司",commissioned:"2002 商轉",description:"澎湖的主要電源。離島電網獨立運轉、柴油成本極高，每度發電成本數倍於本島，是推動澎湖打造「低碳風光大縣」的經濟動機。",insight:"「一度電在澎湖值多少錢？」離島微電網是研究風光儲能整合、電網韌性與能源公平的最佳實驗場。"},{id:"mingtan",name:"大觀發電廠・明潭抽蓄",short:"明潭電廠",type:"hydro",status:"運轉中",city:"南投縣・魚池／水里",lon:120.87,lat:23.84,capacityMw:2602,units:"明潭抽蓄 1,602 MW＋明湖抽蓄 1,000 MW",operator:"台灣電力公司",commissioned:"1985／1995 商轉",description:"以日月潭為上池、水里溪為下池的抽蓄水力系統，合計 2.6 GW，是全台最大的「水力電池」：夜間抽水蓄能，白天放水發電支援尖峰。",insight:"抽蓄水力是電網級儲能的王者：反應快、容量大、壽命逾 40 年。理解它，就能理解為何鋰電池儲能不是唯一的答案。"},{id:"tachia",name:"大甲溪發電廠群",short:"大甲溪電廠",type:"hydro",status:"運轉中",city:"台中市・和平",lon:121.17,lat:24.25,capacityMw:1100,units:"德基・青山・谷關・天輪・馬鞍等梯級開發",operator:"台灣電力公司",commissioned:"1956 起陸續商轉",description:"沿大甲溪 170 公里、落差逾千公尺的梯級水力系統，從德基水庫高水頭慣常式到下游調整池式電廠，一滴水可發電多次。",insight:"「一滴水發七次電」：流域梯級開發展現水資源 Multipurpose 策略，也牽動原住民部落、農業用水與河道生態的分配政治。"},{id:"taipower-offshore1",name:"台電離岸一期風場",short:"離岸一期",type:"wind",status:"運轉中",city:"彰化外海（王功外海 8 km）",lon:120,lat:24.06,capacityMw:109,units:"離岸風機 × 21（5.2 MW）",operator:"台灣電力公司",commissioned:"2020 商轉",description:"台電首座離岸風場，21 部風機佇立彰化外海。從環評到商轉歷時超過十年，為台灣海床地質、颱風工況與海事工程累積寶貴經驗。",insight:"為什麼選在彰化外海？台灣海峽冬季東北季風強勁，全球前十大風場有六處在這裡、水深又淺——先天條件世界級。"},{id:"formosa1",name:"海洋風電（Formosa 1）",short:"海洋風場",type:"wind",status:"運轉中",city:"苗栗外海（竹南—後龍外海 6 km）",lon:119.98,lat:24.72,capacityMw:128,units:"離岸
